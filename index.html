<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A letter for my Queen</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{
  --bg1:#fff1f0;--bg2:#ffd9dd;--ink:#3a1f33;--soft:#7a5570;--paper:#fffaf3;--paperInk:#4a2640;--card:rgba(255,255,255,.72);--line:rgba(58,31,51,.25);
  --env:#f3b9c3;--envDark:#e8a0ae;--flap:#f7c9d1;--pink:#e8456b;--glow:#ff9d5c;--star:rgba(232,69,107,.3);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg1:#14122b;--bg2:#2b1f4a;--ink:#f4ecff;--soft:#b9a9d6;--card:rgba(255,255,255,.08);--line:rgba(244,236,255,.28);
  --env:#7a3d68;--envDark:#6a3059;--flap:#8c4a78;--pink:#ff6f91;--glow:#ffc27a;--star:rgba(255,255,255,.5);}}
:root[data-theme="dark"]{
  --bg1:#14122b;--bg2:#2b1f4a;--ink:#f4ecff;--soft:#b9a9d6;--card:rgba(255,255,255,.08);--line:rgba(244,236,255,.28);
  --env:#7a3d68;--envDark:#6a3059;--flap:#8c4a78;--pink:#ff6f91;--glow:#ffc27a;--star:rgba(255,255,255,.5);}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:"DM Sans",system-ui,sans-serif;color:var(--ink);
  background:linear-gradient(170deg,var(--bg1),var(--bg2));display:flex;justify-content:center;overflow-x:hidden}
.page{width:100%;max-width:460px;padding:24px 18px 60px;text-align:center}
.hint{color:var(--soft);margin:26px 0 0;min-height:1.5em;transition:opacity .4s}
.scene{position:relative;width:min(88vw,340px);height:230px;margin:90px auto 0;perspective:900px;transition:margin .6s}
.env{position:absolute;inset:0;cursor:pointer;background:none;border:0;padding:0;width:100%}
.scene:not(.open) .env{animation:wiggle 4s ease-in-out infinite}
@keyframes wiggle{0%,80%,100%{transform:rotate(0)}84%{transform:rotate(-2.5deg)}88%{transform:rotate(2.5deg)}92%{transform:rotate(-1.5deg)}96%{transform:rotate(1deg)}}
.env:focus-visible{outline:3px solid var(--glow);outline-offset:8px;border-radius:10px}
.back{position:absolute;inset:0;background:var(--envDark);border-radius:10px;box-shadow:0 18px 40px rgba(0,0,0,.25)}
.letter{position:absolute;left:5%;right:5%;top:10px;height:270px;z-index:1;background:var(--paper);color:var(--paperInk);
  border-radius:8px;padding:20px 18px;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.18);transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.pocket{position:absolute;inset:0;z-index:2;pointer-events:none;border-radius:10px;overflow:hidden}
.pocket::before{content:"";position:absolute;inset:0;
  background:linear-gradient(to top right,var(--env) 50%,transparent 50%) left/52% 100% no-repeat,
             linear-gradient(to top left,var(--env) 50%,transparent 50%) right/52% 100% no-repeat}
.pocket::after{content:"";position:absolute;left:0;right:0;bottom:0;height:60%;background:var(--env);
  clip-path:polygon(0 100%,100% 100%,100% 38%,50% 0,0 38%);filter:brightness(1.04)}
.flap{position:absolute;left:0;right:0;top:0;height:60%;z-index:3;transform-origin:top;
  background:var(--flap);clip-path:polygon(0 0,100% 0,50% 100%);transition:transform .7s ease,z-index 0s .35s;pointer-events:none}
.seal{position:absolute;left:50%;top:60%;z-index:4;transform:translate(-50%,-50%);width:50px;height:50px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#ff8aa5,#c81e4a);display:grid;place-items:center;font-size:22px;
  box-shadow:0 3px 8px rgba(0,0,0,.3);transition:opacity .3s;pointer-events:none}
.to{position:absolute;left:0;right:0;bottom:22px;z-index:3;font-family:"Caveat",cursive;font-size:2rem;font-weight:700;color:#5b2243;pointer-events:none;transition:opacity .3s}
:root[data-theme="dark"] .to{color:#ffe6ef}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .to{color:#ffe6ef}}
.open .flap{transform:rotateX(180deg);z-index:0}
.open .seal,.open .to{opacity:0}
.open .letter{z-index:3;transform:translateY(-120px) scale(1.06);transition-delay:.4s;cursor:copy}
.letter h2{font-family:"Caveat",cursive;font-size:2.15rem;line-height:1.05;margin:2px 0 8px;min-height:2.2em}
.letter p{font-family:"Caveat",cursive;font-size:1.35rem;line-height:1.25;margin:0 0 8px}
.letter .big{font-size:2rem}
.letter .sign{margin-top:10px;color:var(--pink);font-weight:700}
.letter > *{opacity:0;transition:opacity .6s}
.open .letter > *{opacity:1}
.open .letter > :nth-child(1){transition-delay:1.1s}.open .letter > :nth-child(2){transition-delay:1.4s}
.open .letter > :nth-child(3){transition-delay:1.7s}.open .letter > :nth-child(4){transition-delay:2s}
.scene.shifted{margin-bottom:150px}
.stamps{position:absolute;inset:0;z-index:6;pointer-events:none}
.kiss{position:absolute;font-size:30px;transform:translate(-50%,-50%) rotate(var(--r));animation:stamp .35s ease-out}
@keyframes stamp{from{transform:translate(-50%,-50%) rotate(var(--r)) scale(2.2);opacity:0}to{transform:translate(-50%,-50%) rotate(var(--r)) scale(1);opacity:1}}
.btn{font:inherit;font-weight:700;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:10px 16px;cursor:pointer;transition:transform .15s,border-color .15s}
.btn:hover{border-color:var(--pink)}.btn:active{transform:scale(.96)}
.btn:focus-visible,input:focus-visible{outline:3px solid var(--glow);outline-offset:2px}
.again{opacity:0;pointer-events:none;transition:opacity .5s;margin-top:14px}
.again.show{opacity:1;pointer-events:auto}
.panel{display:none;margin:24px auto 0;text-align:left;max-width:420px}
.panel.show{display:block;animation:fade .8s}
@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:16px;margin-top:14px}
.card h3{font-size:1rem;margin:0 0 10px}
.meter{display:flex;align-items:center;gap:12px}
.meter input{flex:1;accent-color:var(--pink)}
.meter .em{font-size:2.2rem;width:2.4rem;text-align:center;transition:font-size .15s;line-height:1}
.mtxt{font-family:"Caveat",cursive;font-size:1.6rem;margin-top:6px;min-height:1.3em}
.row{display:flex;gap:8px;flex-wrap:wrap}
.when{min-height:3.2em;font-family:"Caveat",cursive;font-size:1.55rem;line-height:1.25;margin-top:12px}
.when.pop{animation:fade .5s}
.score{margin-left:auto;align-self:center;font-weight:700}
.heart{position:fixed;bottom:-30px;pointer-events:none;z-index:9;will-change:transform}
.catch{position:fixed;top:-40px;z-index:20;cursor:pointer;font-size:34px;user-select:none;-webkit-tap-highlight-color:transparent}
.twinkle{position:fixed;width:3px;height:3px;border-radius:50%;background:var(--star);pointer-events:none}
.theme{position:fixed;right:16px;top:calc(env(safe-area-inset-top,0px) + 14px);font-size:1.2rem;background:none;border:0;cursor:pointer;color:var(--ink);z-index:30}
@media (prefers-reduced-motion:reduce){.scene:not(.open) .env{animation:none}.letter,.flap{transition-duration:.01s}}
</style>
</head>
<body>
<button class="theme" id="theme" aria-label="Switch light or dark theme">◐</button>
<main class="page">
  <div class="scene" id="scene">
    <button class="env" id="env" aria-label="Open the letter">
      <div class="back"></div>
      <div class="letter" id="letter">
        <h2 data-tw>I miss you so much, my dear 💕</h2>
        <p data-tw>Every day apart makes me love you more. You are in my thoughts when I wake up and in my dreams when I sleep.</p>
        <p class="big">❤️ 😘 ❤️</p>
        <p class="sign">Forever yours 💌</p>
      </div>
      <div class="pocket"></div>
      <div class="flap"></div>
      <div class="to">Hello My Queen</div>
      <div class="seal" id="seal">❤️</div>
    </button>
    <div class="stamps" id="stamps"></div>
  </div>
  <p class="hint" id="hint">Tap the envelope to open it</p>
  <button class="btn again" id="again">Read it again</button>

  <section class="panel" id="panel">
    <div class="card">
      <h3>How much do I miss you?</h3>
      <div class="meter"><span class="em" id="em">🙂</span><input type="range" id="range" min="0" max="100" value="10" aria-label="Miss-o-meter"></div>
      <div class="mtxt" id="mtxt">Slide it and find out…</div>
    </div>
    <div class="card">
      <h3>Open when…</h3>
      <div class="row">
        <button class="btn" data-w="0">you miss me</button>
        <button class="btn" data-w="1">you can't sleep</button>
        <button class="btn" data-w="2">you need a smile</button>
      </div>
      <div class="when" id="when" aria-live="polite">Pick a little envelope.</div>
    </div>
    <div class="card">
      <h3>Catch my hearts</h3>
      <div class="row"><button class="btn" id="play">Start 💘</button><span class="score" id="score"></span></div>
    </div>
    <p class="hint" style="text-align:center">Tip: tap the letter to leave a kiss 💋</p>
  </section>
</main>
<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var scene=$('scene'),env=$('env'),hint=$('hint'),again=$('again'),panel=$('panel'),letter=$('letter'),stamps=$('stamps');
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
  var isOpen=false,tok=0,tws=Array.prototype.slice.call(document.querySelectorAll('[data-tw]'));
  tws.forEach(function(e){e.dataset.full=e.textContent;e.textContent=''});

  function typeAll(){
    var my=++tok,i=0;
    function next(){
      if(my!==tok||i>=tws.length)return;
      var el=tws[i++],t=el.dataset.full,n=0;
      if(reduce){el.textContent=t;next();return}
      var iv=setInterval(function(){
        if(my!==tok){clearInterval(iv);return}
        el.textContent=t.slice(0,++n);
        if(n>=t.length){clearInterval(iv);setTimeout(next,150)}
      },38);
    }
    setTimeout(next,1100);
  }
  function clearTw(){tok++;tws.forEach(function(e){e.textContent=''})}

  function hearts(n){
    if(reduce)return;
    var set=['❤️','💕','💗','💖','😘'];
    for(var i=0;i<(n||26);i++){(function(i){
      setTimeout(function(){
        var h=document.createElement('span');h.className='heart';h.textContent=set[i%set.length];
        h.style.fontSize=(14+Math.random()*22)+'px';h.style.left=Math.random()*96+'vw';
        document.body.appendChild(h);
        var dx=(Math.random()-.5)*80,rise=window.innerHeight*(.6+Math.random()*.5);
        h.animate([{transform:'translate(0,0)',opacity:0},{opacity:1,offset:.15},
          {transform:'translate('+dx+'px,-'+rise+'px) rotate('+((Math.random()-.5)*50)+'deg)',opacity:0}],
          {duration:3200+Math.random()*2200,easing:'ease-out'}).onfinish=function(){h.remove()};
      },i*110);})(i)}
  }

  function openIt(){
    isOpen=true;scene.classList.add('open','shifted');env.setAttribute('aria-label','Letter opened');
    hint.style.opacity=0;hearts();typeAll();
    setTimeout(function(){hint.textContent='Sent with all my love';hint.style.opacity=1;again.classList.add('show');panel.classList.add('show')},3000);
  }
  function closeIt(){
    isOpen=false;scene.classList.remove('open','shifted');env.setAttribute('aria-label','Open the letter');
    again.classList.remove('show');panel.classList.remove('show');stamps.innerHTML='';clearTw();hint.style.opacity=0;
    setTimeout(function(){hint.textContent='Tap the envelope to open it';hint.style.opacity=1},500);
  }
  env.addEventListener('click',function(e){
    if(!isOpen){openIt();return}
    var s=scene.getBoundingClientRect();
    if(stamps.children.length>=14)stamps.removeChild(stamps.firstChild);
    var k=document.createElement('span');k.className='kiss';k.textContent='💋';
    k.style.left=(e.clientX-s.left)+'px';k.style.top=(e.clientY-s.top)+'px';
    k.style.setProperty('--r',((Math.random()-.5)*50)+'deg');
    stamps.appendChild(k);
  });
  again.addEventListener('click',closeIt);

  /* Miss-o-meter */
  var range=$('range'),em=$('em'),mtxt=$('mtxt'),maxed=false;
  function meter(){
    var v=+range.value,faces=['🙂','😊','🥰','😍','😘','🥺','😭'];
    em.textContent=v>=100?'💥':faces[Math.min(faces.length-2,Math.floor(v/17))];
    em.style.fontSize=(1.6+v/100*1.6)+'rem';
    var t=v<25?'A little bit…':v<50?'A lot…':v<75?'So, so much…':v<100?'More than words can say…':'Off the charts! Infinity and beyond ♾️💕';
    mtxt.textContent=t;
    if(v>=100&&!maxed){maxed=true;hearts(30)}
    if(v<100)maxed=false;
  }
  range.addEventListener('input',meter);meter();

  /* Open when */
  var notes=[
    'Look at the stars tonight. I am under the same sky, thinking of you. 🌙',
    'Close your eyes. I am hugging you tight across the miles. Sweet dreams, my Queen. 😴💕',
    'You are the most beautiful person I know, inside and out. Now smile for me 😊'];
  Array.prototype.forEach.call(document.querySelectorAll('[data-w]'),function(b){
    b.addEventListener('click',function(){
      var w=$('when');w.textContent=notes[+b.dataset.w];w.classList.remove('pop');void w.offsetWidth;w.classList.add('pop');
    });
  });

  /* Catch the hearts */
  var playing=false;
  $('play').addEventListener('click',function(){
    if(playing)return;playing=true;
    var caught=0,total=0,sc=$('score');sc.textContent='Caught 0';
    var set=['❤️','💖','💗','💘'],spawn=setInterval(function(){
      if(total>=12){clearInterval(spawn);setTimeout(end,4200);return}
      total++;
      var h=document.createElement('span');h.className='catch';h.textContent=set[total%4];
      h.setAttribute('role','button');h.setAttribute('aria-label','Catch heart');
      h.style.left=(6+Math.random()*82)+'vw';document.body.appendChild(h);
      var a=h.animate([{transform:'translateY(0)'},{transform:'translateY('+(window.innerHeight+80)+'px)'}],{duration:3800,easing:'linear'});
      a.onfinish=function(){h.remove()};
      h.addEventListener('pointerdown',function(){
        if(h.dataset.d)return;h.dataset.d=1;caught++;sc.textContent='Caught '+caught;
        h.textContent='💥';a.cancel();setTimeout(function(){h.remove()},250);
        h.style.top=(h.getBoundingClientRect().top)+'px';
      });
    },650);
    function end(){
      playing=false;
      sc.textContent=caught>=8?'Caught '+caught+'. You have my whole heart 💘':'Caught '+caught+' of 12. You still have my heart 💘';
      hearts(18);
    }
  });

  $('theme').onclick=function(){
    var r=document.documentElement,
      dark=r.getAttribute('data-theme')?r.getAttribute('data-theme')==='dark':matchMedia('(prefers-color-scheme:dark)').matches;
    r.setAttribute('data-theme',dark?'light':'dark');
  };
  if(!reduce){for(var i=0;i<26;i++){var s=document.createElement('span');s.className='twinkle';
    s.style.left=Math.random()*100+'vw';s.style.top=Math.random()*100+'vh';
    s.animate([{opacity:.1},{opacity:1},{opacity:.1}],{duration:2200+Math.random()*3000,iterations:Infinity,delay:Math.random()*2000});
    document.body.appendChild(s)}}
})();
</script>
</body>
</html>
